# Put this file in /etc/nginx/conf.d/vaultline.conf.
# The limit_*_zone directives must live in the nginx http context; files in conf.d
# are normally included there.

limit_req_zone $binary_remote_addr zone=vaultline_global:10m rate=12r/s;
limit_req_zone $binary_remote_addr zone=vaultline_auth:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=vaultline_signed:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=vaultline_conn:10m;

server {
    listen 80;
    server_name ukrainecommunity.pp.ua www.ukrainecommunity.pp.ua;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ukrainecommunity.pp.ua www.ukrainecommunity.pp.ua;

    client_max_body_size 25m;
    client_body_timeout 15s;
    keepalive_timeout 20s;
    send_timeout 20s;

    ssl_certificate /etc/letsencrypt/live/ukrainecommunity.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ukrainecommunity.pp.ua/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    limit_req zone=vaultline_global burst=50 nodelay;
    limit_conn vaultline_conn 25;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location /api/auth/ {
        limit_req zone=vaultline_auth burst=8 nodelay;
        proxy_pass http://127.0.0.1:4173;
    }

    location /s/ {
        limit_req zone=vaultline_signed burst=40 nodelay;
        proxy_pass http://127.0.0.1:4173;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
    }
}
